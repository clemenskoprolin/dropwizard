---
name: J2K Evaluation

"on":
  workflow_dispatch:
    inputs:
      runSecondaryBenchmark:
        description: 'Run Petclinic secondary benchmark'
        required: false
        default: 'true'
        type: boolean
      runEdgeCases:
        description: 'Run custom edge-case dataset'
        required: false
        default: 'true'
        type: boolean
  push:
    paths:
      - '.github/workflows/j2k-evaluate.yml'
      - 'tools/j2k-evaluator/**'
      - 'tools/headless-j2k-runner/**'
      - 'benchmarks/**'
      - 'docs/**'
  pull_request:
    paths:
      - '.github/workflows/j2k-evaluate.yml'
      - 'tools/j2k-evaluator/**'
      - 'tools/headless-j2k-runner/**'
      - 'benchmarks/**'
      - 'docs/**'

env:
  J2K_JAR: tools/j2k-evaluator/target/j2k-evaluator.jar
  HEADLESS_RUNNER_DIR: tools/headless-j2k-runner

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Build headless J2K runner plugin
        run: |
          gradle -p "${HEADLESS_RUNNER_DIR}" buildPlugin --no-daemon
          echo "Headless J2K runner plugin built successfully"

      # Install all modules to the local Maven cache first so that inter-module
      # SNAPSHOT deps are resolvable by dependency:build-classpath below.
      - name: Install dropwizard-example and its dependencies (skip tests)
        run: ./mvnw -pl dropwizard-example -am install -DskipTests -q

      - name: Validate dropwizard-example baseline tests
        run: |
          ./mvnw -pl dropwizard-example test -q \
            -Dsurefire.failIfNoSpecifiedTests=false

      - name: Prepare dropwizard-example dependency classpath
        run: |
          OUT="${GITHUB_WORKSPACE}/dropwizard-example/target/classpath.txt"
          ./mvnw -pl dropwizard-example dependency:build-classpath \
            -Dmdep.outputFile="${OUT}" -q
          echo "EXAMPLE_CLASSPATH_FILE=${OUT}" >> "$GITHUB_ENV"

      - name: Build j2k-evaluator tool
        run: ./mvnw -f tools/j2k-evaluator/pom.xml package -q

      - name: Convert dropwizard-example sources (primary)
        run: |
          java -jar "${J2K_JAR}" convert-primary \
            --source dropwizard-example/src \
            --output artifacts/converted/dropwizard-example \
            --headless-runner-dir "${HEADLESS_RUNNER_DIR}" \
            --classpath-file "${EXAMPLE_CLASSPATH_FILE}"

      - name: Evaluate converted primary sources
        run: |
          java -jar "${J2K_JAR}" evaluate-primary \
            --source dropwizard-example/src \
            --converted artifacts/converted/dropwizard-example \
            --output artifacts/reports

      - name: Run Petclinic secondary benchmark
        if: ${{ inputs.runSecondaryBenchmark != false }}
        run: |
          java -jar "${J2K_JAR}" compare-petclinic \
            --headless-runner-dir "${HEADLESS_RUNNER_DIR}" \
            --output artifacts/reports

      - name: Run edge-case dataset
        if: ${{ inputs.runEdgeCases != false }}
        run: |
          java -jar "${J2K_JAR}" run-edge-cases \
            --dataset benchmarks/edge-cases \
            --headless-runner-dir "${HEADLESS_RUNNER_DIR}" \
            --output artifacts/reports

      - name: Verify no stub output
        run: |
          STUBS=$(grep -rl "^// STUB" artifacts/converted/ 2>/dev/null | wc -l)
          if [ "$STUBS" -gt 0 ]; then
            echo "::error::Found $STUBS stub .kt file(s) — real conversion must have run"
            grep -rl "^// STUB" artifacts/converted/
            exit 1
          fi
          echo "Stub check passed (0 stub files)"

      - name: Upload evaluation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: j2k-evaluation-${{ github.run_id }}
          path: artifacts/
          retention-days: 30

      - name: Write step summary
        if: always()
        run: |
          echo "## J2K Evaluation — run \`${{ github.run_id }}\` (headless-j2k)" \
            >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          SUMMARY_FILE="artifacts/reports/primary-summary.md"
          if [ -f "$SUMMARY_FILE" ]; then
            cat "$SUMMARY_FILE" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Primary evaluation report not generated_" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

          PETCLINIC_FILE="artifacts/reports/petclinic-summary.md"
          if [ -f "$PETCLINIC_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$PETCLINIC_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi

          EDGE_FILE="artifacts/reports/edge-cases-summary.md"
          if [ -f "$EDGE_FILE" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            cat "$EDGE_FILE" >> "$GITHUB_STEP_SUMMARY"
          fi
